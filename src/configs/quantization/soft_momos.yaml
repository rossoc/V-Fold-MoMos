enabled: true
method: soft_momos

rows: 1
cols: 2

# Motifs in the per-epoch training mosaic: absolute k, or capacity (fraction of
# blocks) when k is null.
k: 256
capacity: null

# Codebook size stored after training (k-means++ on all blocks); this is what
# the bit accounting uses.
final_k: 256

force_zero: true

# Penalty weight on the mean squared deviation of each block from its group
# mean, linearly ramped over the first lam_warmup_fraction of the epochs.
lam: 1.0
lam_warmup_fraction: 0.0

# Growing L1 term: penalty = lam * L2 + mu(epoch) * L1, with L1 the mean absolute
# deviation of each block from its group mean (constant-magnitude gradient, so it
# keeps pulling weights onto the mosaic where L2 fades). mu goes from l1_init to
# l1_final over the epochs before the freeze (or all epochs if freeze_fraction is
# 0); both 0 = off. l1_schedule: linear | cosine (1 - cos(pi t / 2)) | power
# (t ** l1_power).
l1_init: 0.0
l1_final: 0.0
l1_schedule: cosine
l1_power: 2.0

# Validate on Z[M] (raw weights are restored right after) instead of raw weights.
validate_projected: true

# Post-training k-means++ (run once on the best checkpoint before val/test).
finalize:
  backend: minibatch   # minibatch | exact
  max_iter: 100
  n_init: auto
  seed: ${seed}

chunk_size: null

# soft_momos_plus extensions (off here; see soft_momos_plus.yaml).
# warm_start: the per-epoch mosaic is `lloyd_iters` Lloyd steps from the previous
# one instead of a fresh random draw; reseed_dead refills empty motifs with random
# blocks. freeze_fraction: for the last ceil(fraction * epochs) epochs the mosaic is
# frozen and only the codebook Z is trained.
warm_start: false
reseed_dead: true
lloyd_iters: 1
freeze_fraction: 0.0
