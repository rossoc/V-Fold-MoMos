defaults:
  - dataset: cifar10
  - model: mlp
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

epochs: 100
seed: 42
fold: null
data_dir: ./data
batch_size: 128
accelerator: auto
devices: 1
precision: null

log_dir: ./outputs
prefix: tune_quantization

evaluate_test: false
save_init_ckpt: false

# Default quantization placeholder
quantization:
  enabled: true
  method: none

# Weights & Biases configuration
wandb:
  enabled: true
  project: mlp-paretofront3
  entity: null
  name: null
  group: ${optuna.study_name}
  tags: [optuna, quantization-search]
  log_model: false

# Optuna configuration
optuna:
  study_name: mlp_paretofront3
  storage_dir: ./outputs/optuna
  n_trials: 30
  eval_folds_search: [0]  # Fold(s) to evaluate during trial search
  pareto_kfold_eval: true # If true, re-evaluate Pareto-best configs on all K folds
  pareto_seeds: [85, 28, 57] # Random seeds for Pareto-best verification

  sampler:
    seed: 42

  pruner:
    enabled: true
    monitor: val/acc
    n_startup_trials: 5
    n_warmup_steps: 10
    percentile: 50.0
    min_history: 5
    # Compare a trial only against trials with (nearly) the same
    # compression_rate user_attr: accuracy differs systematically along the
    # compression axis, and a study-wide median prunes the high-compression
    # side of the front. null = study-wide comparison.
    stratify_by: compression_rate
    stratify_rtol: 0.05

  # Pareto feasibility floor: trials with mean val_acc below this are marked
  # infeasible and excluded from the front (drops ~random-guess points).
  min_val_accuracy: 0.20

  reuse_completed_trials: true

  methods:
    - none
    - momos2d
    - qat
    - hierarchical_momos2d
    - fold_momos
    - soft_momos
    - soft_momos_plus

  search_space:
    momos2d:
      rows: [1, 2]
      cols: [1, 2, 4]
      capacity:
        low: 0.0001
        high: 0.03
        log: true

    qat:
      q: [2, 4, 8, 16, 32]

    hierarchical_momos2d:
      switch_fraction: 0.0
      primary:
        rows: [1, 2]
        cols: [1, 2]
        capacity:
          low: 0.0001
          high: 0.03
          log: true

      secondary:
        rows: [16, 32, 64]
        cols: [16, 32, 64]
        capacity:
          low: 0.02
          high: 0.5
          log: true

    # secondary.capacity here sizes the per-fold k-means training pool
    # (k_per_bucket = round(K_primary * capacity)), not a per-fold storage cap
    # like hierarchical_momos2d's -- see src/quantizers/fold_momos.py.
    fold_momos:
      switch_fraction: 0.0
      primary:
        rows: [1, 2]
        cols: [1, 2]
        capacity:
          low: 0.0001
          high: 0.03
          log: true

      secondary:
        rows: [16, 32, 64]
        cols: [16, 32, 64]
        capacity:
          low: 0.02
          high: 0.5
          log: true

    # final_k is fixed (not searched): it sets the stored codebook size (8 bits
    # per block at 256). capacity sizes the per-epoch training mosaic.
    soft_momos:
      # Searched: block shape (rows x cols) and the penalty weight lam.
      # Fixed: k = final_k = 256 motifs -> 8 bits per block, so compression is
      # 8/(rows*cols) bits per weight plus the 256*s*32-bit codebook. Set k to
      # null and add a capacity {low, high, log} block to search capacity too.
      # Every entry can be overridden from the command line, e.g.
      #   optuna.search_space.soft_momos.rows=[1,2,4] \
      #   optuna.search_space.soft_momos.lam.high=1e5
      # Study mlp_soft_momos (100-epoch trials only): at block size 2, lam 0.3,
      # 5 and 2142 all reach ~0.55, so the low end of lam is kept; the upper
      # bound is widened to 1e5 because it was never explored at large blocks.
      rows: [1, 2, 4]
      cols: [1, 2, 4, 8]
      k: 256
      final_k: 256
      # The penalty is the MEAN squared deviation per weight, so lam has to be
      # ~n times larger than a sum-based L2 coefficient; 1e4 ~ weight_decay
      # 1e-2 on a 1M-parameter model.
      lam:
        low: 0.1
        high: 100000.0
        log: true

    soft_momos_plus:
      # Same searched space as soft_momos (so the two fronts are comparable);
      # no final_k: after the frozen phase the trained codebook (k motifs) is
      # kept as is. freeze_fraction/lloyd_iters are fixed (scalars); give
      # freeze_fraction a {low, high} block to search it.
      rows: [1, 2, 4]
      cols: [1, 2, 4, 8]
      k: 256
      lam:
        low: 0.1
        high: 100000.0
        log: true
      freeze_fraction: 0.1
      lloyd_iters: 1
